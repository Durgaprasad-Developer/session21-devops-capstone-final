name: BookEase CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── 1. Backend Automated Tests (M2) ─────────────────────────────────────────
  test-backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest (Isolated SQLite Database)
        run: |
          pytest -v --durations=10

  # ── 2. Frontend Build Verification (M1, M5) ──────────────────────────────────
  build-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Build production bundle
        run: npm run build

  # ── 3. Terraform IaC Offline Validation (M7) ─────────────────────────────────
  validate-terraform:
    name: Terraform IaC Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check HCL formatting
        run: terraform fmt -check

      - name: Initialize Terraform (Offline / No Backend)
        run: terraform init -backend=false

      - name: Validate configuration syntax & providers
        run: terraform validate

  # ── 4. Secret Scanning Gate (M3, M6) ────────────────────────────────────────
  scan-secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # ── 5. Helm Chart Linting & Templates (M8) ───────────────────────────────────
  lint-helm:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint BookEase Helm Chart
        run: helm lint ./helm/bookease

      - name: Render Helm templates test
        run: helm template bookease ./helm/bookease > /dev/null

  # ── 6. Docker Compose Integration & Smoke Test (M4) ─────────────────────────
  test-docker-compose:
    name: Docker Compose Smoke Test
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build & start stack
        run: docker compose up --build -d

      - name: Wait for backend readiness & database connectivity
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/ready | grep -q '"database":"connected"'; then
              echo "Backend and database are READY!"
              break
            fi
            echo "Waiting for services to become healthy... ($i/30)"
            sleep 2
          done

      - name: Validate health probes
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/ready

      - name: Validate frontend delivery
        run: |
          curl -f http://localhost:3000

      - name: Check container statuses
        run: docker compose ps

      - name: Clean up stack
        if: always()
        run: docker compose down -v

  # ── 7. Docker Image Build & Trivy Vulnerability Scan (M4, M6) ────────────────
  build-and-scan:
    name: Build & Scan Docker Images
    needs: [test-backend, build-frontend, validate-terraform, scan-secrets, lint-helm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image coordinates (lowercase repository)
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${REPO_LOWER}/bookease-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${REPO_LOWER}/bookease-frontend" >> $GITHUB_ENV
          echo "SHA_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ env.SHA_TAG }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ env.SHA_TAG }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            ./frontend

      - name: Scan backend image with Trivy (DevSecOps Gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.SHA_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan frontend image with Trivy (DevSecOps Gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.SHA_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Save images to archives for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/images
          docker save -o /tmp/images/backend.tar ${{ env.BACKEND_IMAGE }}:${{ env.SHA_TAG }} ${{ env.BACKEND_IMAGE }}:latest
          docker save -o /tmp/images/frontend.tar ${{ env.FRONTEND_IMAGE }}:${{ env.SHA_TAG }} ${{ env.FRONTEND_IMAGE }}:latest

      - name: Upload image artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/images/
          retention-days: 1

  # ── 8. Publish Images to GitHub Container Registry (M5) ─────────────────────
  publish:
    name: Publish Images to GHCR
    needs: [build-and-scan, test-docker-compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/images

      - name: Load images into Docker daemon
        run: |
          docker load -i /tmp/images/backend.tar
          docker load -i /tmp/images/frontend.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend and frontend images with SHA & latest tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/${REPO_LOWER}/bookease-backend:${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}/bookease-backend:latest
          docker push ghcr.io/${REPO_LOWER}/bookease-frontend:${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}/bookease-frontend:latest
