apiVersion: v1
kind: Service
metadata:
  name: {{ include "bookease.fullname" . }}-backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "bookease.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: backend
    {{- include "bookease.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "bookease.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: backend
    {{- include "bookease.selectorLabels" . | nindent 4 }}

