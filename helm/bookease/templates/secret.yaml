apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookease.fullname" . }}-secret
  labels:
    {{- include "bookease.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  database-url: "postgresql+psycopg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "bookease.fullname" . }}-postgres:5432/{{ .Values.postgresql.auth.database }}"
